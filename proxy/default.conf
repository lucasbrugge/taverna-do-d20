server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    # Imagens dos produtos: volume compartilhado apenas para leitura.
    location ^~ /storage/ {
        root /var/www;
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    # API Laravel e endpoint CSRF do Sanctum: mantém a URL original.
    # A API FrankenPHP escuta HTTP na porta 80 do container.
    location ~ ^/(api|sanctum)(/|$) {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
    }

    # Frontend compilado pelo Vite, servido por outro Nginx.
    location / {
        proxy_pass http://front:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
