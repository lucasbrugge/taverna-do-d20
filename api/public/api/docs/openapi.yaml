# Mantido a partir de routes, controllers, requests, resources, services, models e migrations.
openapi: 3.0.3
info:
  title: Taverna do D20 — API
  version: 1.0.0
  description: |-
    Contrato das rotas atuais de routes/api.php e do endpoint CSRF do Sanctum. A versão identifica esta documentação.

    ### Sessão e Try it out
    Use esta página na mesma origem da aplicação (por exemplo, http://127.0.0.1:8080/api/docs). O navegador preserva os cookies. Antes de POST, PUT, PATCH ou DELETE, a UI solicita GET /sanctum/csrf-cookie e envia o cookie XSRF-TOKEN decodificado no cabeçalho X-XSRF-TOKEN. Para entrar, execute /api/auth/login (ou /api/auth/register); depois execute os endpoints autenticados. /api/auth/logout encerra a sessão. Não há valor a preencher em Authorize: a autenticação é a própria sessão do navegador.

    O guard web usa session, e statefulApi() aplica os middlewares de cookie/sessão/CSRF quando Referer ou Origin corresponde a SANCTUM_STATEFUL_DOMAINS. O Compose inclui 127.0.0.1:8080 e localhost:8080 por padrão. SESSION_COOKIE/APP_NAME controlam o nome do cookie de sessão. Mantenha o mesmo host durante todo o fluxo. Chamadas JSON usam Accept: application/json; uma sessão ausente retorna 401 e uma falha CSRF retorna 419.

    ### Acesso e formatos
    Cada operação descreve seu acesso e possui x-access: public, session ou admin. User::isAdmin() exige role === admin; o padrão de novos usuários no banco é client. O middleware admin e os Form Requests administrativos verificam essa condição. Não há policies, gates ou permissões adicionais registrados na aplicação. Propriedade de endereços e pedidos é conferida nos controllers/services.

    Resources usam envelope data; paginação acrescenta links e meta. /api/user retorna o model diretamente; status, logout e carrinho retornam JSON direto. Apenas produtos (12), pedidos próprios (10) e pedidos administrativos (10) são paginados. Relações não carregadas são omitidas: listas de pedidos não incluem items; customer aparece apenas na administração.

    Os GET registrados pelo Laravel também aceitam HEAD, com os mesmos cabeçalhos e sem corpo. Os caminhos da especificação já incluem /api; o server / usa a raiz da mesma origem, inclusive para /sanctum/csrf-cookie. / e /up são rotas internas do backend que o proxy público encaminha ao frontend; não são operações desta API pública. Rotas de storage fornecidas pelo framework também ficam fora deste contrato; as imagens públicas são servidas pelo proxy em /storage/.
servers:
- url: /
  description: Mesma origem desta página; os paths já incluem o prefixo /api.
tags:
- name: Status
  description: Disponibilidade da API.
- name: Autenticação
  description: Cadastro, sessão web, usuário atual e CSRF do Sanctum.
- name: Categorias
  description: Consulta pública de categorias.
- name: Produtos
  description: Catálogo público de produtos ativos.
- name: Carrinho
  description: Carrinho de visitante por cookie ou da conta autenticada.
- name: Endereços
  description: Endereços da própria conta.
- name: Pedidos
  description: Checkout e acompanhamento, pagamento simulado e cancelamento.
- name: Categorias administrativas
  description: Criação, atualização e exclusão restritas a admin.
- name: Produtos administrativos
  description: Catálogo e gestão restritos a admin.
- name: Pedidos administrativos
  description: Lista geral e avanço de status restritos a admin.
paths:
  /api/status:
    get:
      tags:
      - Status
      operationId: apiStatus
      summary: Consultar status da API
      description: |-
        Acesso público.

        Retorna os valores fixos application e status.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    type: string
                    enum:
                    - Taverna do D20
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - application
                - status
  /sanctum/csrf-cookie:
    get:
      tags:
      - Autenticação
      operationId: csrfCookie
      summary: Obter cookies de sessão e CSRF
      description: |-
        Acesso público.

        Endpoint do Sanctum sob middleware web. Retorna corpo vazio e cookies de sessão e XSRF-TOKEN. O nome do cookie de sessão depende de SESSION_COOKIE/APP_NAME. A UI faz esta chamada automaticamente antes de cada escrita.
      x-access: public
      responses:
        '204':
          description: Sem conteúdo; cookies enviados por Set-Cookie.
          headers:
            Set-Cookie:
              description: Cookies de sessão (HttpOnly) e XSRF-TOKEN (legível pelo JavaScript). O navegador os gerencia
                automaticamente.
              schema:
                type: string
  /api/auth/register:
    post:
      tags:
      - Autenticação
      operationId: register
      summary: Cadastrar e iniciar sessão
      description: |-
        Acesso público.

        Cria usuário com o padrão client no banco, autentica pelo guard web, regenera a sessão e une o carrinho visitante à conta. role não é um campo aceito pelo cadastro.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: public
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/Throttled'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
  /api/auth/login:
    post:
      tags:
      - Autenticação
      operationId: login
      summary: Iniciar sessão
      description: |-
        Acesso público.

        Autentica com email e password pelo guard web, regenera a sessão e une o carrinho visitante à conta. Credenciais inválidas retornam 422 com errors.email=["Credenciais inválidas."].

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/Throttled'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /api/auth/me:
    get:
      tags:
      - Autenticação
      operationId: currentUser
      summary: Consultar usuário autenticado
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Retorna UserResource com envelope data, sem timestamps.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/user:
    get:
      tags:
      - Autenticação
      operationId: rawCurrentUser
      summary: Consultar model do usuário autenticado
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Retorna o model User diretamente, sem envelope data; inclui email_verified_at, created_at e updated_at.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/auth/logout:
    post:
      tags:
      - Autenticação
      operationId: logout
      summary: Encerrar sessão
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Encerra a autenticação web, invalida a sessão e regenera o token CSRF. Não recebe corpo.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    enum:
                    - Logout realizado com sucesso.
                required:
                - message
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
  /api/categories:
    get:
      tags:
      - Categorias
      operationId: listCategories
      summary: Listar categorias
      description: |-
        Acesso público.

        Todas as categorias ordenadas por name, sem paginação; envelope data.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
  /api/products:
    get:
      tags:
      - Produtos
      operationId: listProducts
      summary: Listar produtos ativos
      description: |-
        Acesso público.

        Ignora produtos excluídos logicamente. Pesquisa por nome com LIKE %search%; category filtra pelo slug existente. Inclui ativos sem estoque. Paginação fixa de 12; links preservam a query string.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsPage'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      parameters:
      - name: search
        in: query
        description: Pesquisa no nome do produto.
        schema:
          type: string
          maxLength: 100
          nullable: true
      - name: category
        in: query
        description: Slug que existe em categories.slug; inexistente retorna 422.
        schema:
          type: string
          nullable: true
      - name: sort
        in: query
        description: 'recent: created_at DESC, id DESC; preços: price ASC/DESC, id ASC.'
        schema:
          type: string
          enum:
          - recent
          - price_asc
          - price_desc
          default: recent
          nullable: true
      - name: page
        in: query
        description: Página, validada como inteiro >= 1.
        schema:
          type: integer
          minimum: 1
          default: 1
  /api/products/{id}:
    get:
      tags:
      - Produtos
      operationId: showProduct
      summary: Consultar produto ativo
      description: |-
        Acesso público.

        Produto inativo, excluído logicamente ou inexistente retorna 404. Sem restrição de estoque.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: id
        in: path
        required: true
        description: ID numérico do produto.
        schema:
          type: integer
  /api/cart:
    get:
      tags:
      - Carrinho
      operationId: showCart
      summary: Consultar ou criar carrinho atual
      description: |-
        Acesso público.

        Usa o usuário do guard web quando autenticado; caso contrário usa o cookie taverna_guest_cart, HttpOnly, SameSite=Lax, válido por 30 dias. Cria o carrinho/cookie se necessário, inclusive neste GET. Preserve os cookies e a origem stateful para reutilizar o carrinho. Sem paginação ou envelope data.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
  /api/cart/items:
    post:
      tags:
      - Carrinho
      operationId: addCartItem
      summary: Adicionar quantidade ao carrinho
      description: |-
        Acesso público.

        Disponível para visitantes e usuários. Soma quantity ao item do mesmo produto. Não reserva estoque. Produto inativo/sem estoque retorna 422 (product_id); quantidade total acima do estoque retorna 422 (quantity). Produto excluído logicamente pode retornar 404 após exists.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
  /api/cart/items/{item}:
    patch:
      tags:
      - Carrinho
      operationId: updateCartItem
      summary: Definir quantidade ou remover item
      description: |-
        Acesso público.

        Disponível para visitantes e usuários, somente no carrinho atual. quantity=0 remove o item, mesmo se o produto estiver indisponível. Produto inativo/excluído ou quantidade acima do estoque retorna 422 em quantity. Item de outro carrinho retorna 404.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      parameters:
      - name: item
        in: path
        required: true
        description: ID da linha do carrinho, não do produto.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemUpdateInput'
    delete:
      tags:
      - Carrinho
      operationId: deleteCartItem
      summary: Remover item do carrinho
      description: |-
        Acesso público.

        Disponível para visitantes e usuários; remove somente do carrinho atual. Item de outro carrinho retorna 404. Não recebe corpo. Retorna o resumo restante com 200.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: public
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
      parameters:
      - name: item
        in: path
        required: true
        description: ID da linha do carrinho.
        schema:
          type: integer
  /api/addresses:
    get:
      tags:
      - Endereços
      operationId: listAddresses
      summary: Listar próprios endereços
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Somente endereços do usuário autenticado, por created_at DESC, sem paginação. Admin também lista apenas seus endereços.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Endereços
      operationId: createAddress
      summary: Cadastrar endereço próprio
      description: |-
        Exige sessão autenticada (auth:sanctum).

        O user_id vem da sessão. Não consulta serviços externos de CEP.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: session
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
  /api/addresses/{address}:
    put:
      tags:
      - Endereços
      operationId: updateAddress
      summary: Atualizar endereço próprio
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Exige o corpo completo, exceto complement. Endereço de outro usuário retorna 403, inclusive para admin. Pedidos anteriores mantêm o snapshot original.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      parameters:
      - name: address
        in: path
        required: true
        description: ID numérico do endereço.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
    delete:
      tags:
      - Endereços
      operationId: deleteAddress
      summary: Excluir endereço próprio
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Endereço de outro usuário retorna 403, inclusive para admin. FK dos pedidos passa a null e o snapshot shipping_address é preservado. Não recebe corpo.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: session
      responses:
        '204':
          description: Endereço excluído; sem conteúdo.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
      parameters:
      - name: address
        in: path
        required: true
        description: ID numérico do endereço.
        schema:
          type: integer
  /api/orders:
    get:
      tags:
      - Pedidos
      operationId: listOrders
      summary: Listar próprios pedidos
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Somente pedidos do usuário autenticado, mesmo se admin. Ordenação por id DESC, 10 por página. Omite items e customer; não aceita filtro de status.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
      - name: page
        in: query
        description: Página do paginator Laravel. Nas listagens administrativas e de pedidos não há Form Request
          validando page; valores inválidos caem na primeira página.
        schema:
          type: integer
          minimum: 1
          default: 1
    post:
      tags:
      - Pedidos
      operationId: checkout
      summary: Criar pedido a partir do carrinho
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Exige endereço da própria conta e carrinho não vazio. Em transação, revalida disponibilidade/estoque, congela endereço, nomes e preços, desconta estoque e esvazia o carrinho. Cria pending_payment; frete atual 0.00. Limite monetário por item/total: 99999999.99. Endereço de outra conta, carrinho vazio, indisponibilidade ou valores excedidos retornam 422 (address_id ou cart).

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: session
      responses:
        '201':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
  /api/orders/{order}:
    get:
      tags:
      - Pedidos
      operationId: showOrder
      summary: Consultar pedido
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Permitido ao proprietário ou a admin. Inclui items; omite customer.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: order
        in: path
        required: true
        description: ID numérico do pedido.
        schema:
          type: integer
  /api/orders/{order}/pay:
    post:
      tags:
      - Pedidos
      operationId: payOrder
      summary: Confirmar pagamento de pedido pendente
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Somente o comprador, inclusive quando o solicitante é admin. Simulação local: não recebe dados de cartão nem chama gateway. pending_payment → paid e preenche paid_at. Não recebe corpo.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Pedido não está aguardando pagamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
      parameters:
      - name: order
        in: path
        required: true
        description: ID numérico do pedido.
        schema:
          type: integer
  /api/orders/{order}/cancel:
    post:
      tags:
      - Pedidos
      operationId: cancelOrder
      summary: Cancelar pedido pendente e repor estoque
      description: |-
        Exige sessão autenticada (auth:sanctum).

        Permitido ao proprietário ou a admin, apenas em pending_payment. Repõe estoque inclusive de produtos excluídos logicamente, muda para canceled e preenche canceled_at em transação. Não recebe corpo.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: session
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Somente pedidos pendentes podem ser cancelados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '419':
