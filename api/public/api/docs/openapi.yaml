        description: ID do produto (route model binding).
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductMultipartUpdateInput'
    patch:
      tags:
      - Produtos administrativos
      operationId: patchProduct
      summary: Atualizar produto parcialmente
      description: |-
        Exige sessão autenticada e role exatamente admin (middleware admin e User::isAdmin()).

        PUT e PATCH aceitam campos parciais. Upload novo substitui a imagem e apaga o arquivo anterior; omitir image ou enviar null conserva a imagem. Multipart direto é processado pelo PHP 8.4/Symfony do contêiner. Também é possível usar POST com _method=PATCH ou PUT, como faz o frontend; não é uma rota POST adicional.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: admin
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '413':
          description: 'Corpo acima de client_max_body_size 5m do proxy nginx existente; retorna HTML antes de alcançar
            o Laravel. O limite de imagem do Form Request é menor: 2048 KiB (422).'
          content:
            text/html:
              schema:
                type: string
      parameters:
      - name: product
        in: path
        required: true
        description: ID do produto (route model binding).
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductMultipartUpdateInput'
    delete:
      tags:
      - Produtos administrativos
      operationId: deleteProduct
      summary: Excluir produto logicamente
      description: |-
        Exige sessão autenticada e role exatamente admin (middleware admin e User::isAdmin()).

        Soft delete: preserva referências e arquivo de imagem. Produto deixa de aparecer nas consultas de produtos e fica indisponível no carrinho. Não recebe corpo.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: admin
      responses:
        '204':
          description: Produto excluído logicamente; sem conteúdo.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
      parameters:
      - name: product
        in: path
        required: true
        description: ID do produto (route model binding).
        schema:
          type: integer
  /api/admin/orders:
