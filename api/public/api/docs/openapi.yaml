      description: |-
        Exige sessão autenticada e role exatamente admin (middleware admin e User::isAdmin()).

        Aceita JSON sem arquivo ou multipart/form-data para upload. Armazena imagens no disco public em products/. Retorna o model recém-criado: price e stock podem conservar o tipo recebido. category é carregada.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
