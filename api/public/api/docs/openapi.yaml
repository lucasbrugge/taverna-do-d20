  responses:
    Unauthenticated:
      description: Sessão ausente ou expirada (auth:sanctum).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Usuário sem autorização para esta operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AdminForbidden:
      description: Acesso restrito a administradores. O usuário autenticado não possui role exatamente admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Registro não encontrado, excluído logicamente ou fora do escopo permitido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CsrfMismatch:
      description: CSRF inválido/expirado em requisição stateful. Obtenha /sanctum/csrf-cookie, preserve os cookies
        e envie X-XSRF-TOKEN decodificado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Falha de validação; consulte errors por campo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Throttled:
      description: 'Limite do middleware throttle:5,1 atingido: 5 tentativas por minuto. Login e cadastro compartilham
        a assinatura do limitador para o mesmo cliente.'
      headers:
        Retry-After:
          description: Segundos até nova tentativa.
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
