  /api/admin/orders/{order}/status:
    patch:
      tags:
      - Pedidos administrativos
      operationId: advanceOrderStatus
      summary: Marcar pedido como enviado ou entregue
      description: |-
        Exige sessão autenticada e role exatamente admin (middleware admin e User::isAdmin()).

        Aceita somente paid → shipped (preenche shipped_at) ou shipped → delivered (preenche delivered_at). Inclui items e customer. Não permite pagar/cancelar por esta rota.

        Em chamadas stateful, exige CSRF; o Swagger UI obtém /sanctum/csrf-cookie e envia X-XSRF-TOKEN automaticamente.
      x-access: admin
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transição de status inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '419':
          $ref: '#/components/responses/CsrfMismatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      parameters:
      - name: order
        in: path
        required: true
        description: ID numérico do pedido.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusInput'
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      description: 'Formato JSON dos erros HTTP com Accept: application/json. APP_DEBUG pode acrescentar exception,
        file, line e trace.'
      required:
      - message
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      description: Erros de Form Requests, validações dos controllers ou regras de negócio. As chaves de errors
        identificam os campos afetados.
      required:
      - message
      - errors
    Money:
      type: string
      pattern: ^\d+\.\d{2}$
      example: '49.90'
      description: Valor decimal serializado como string, com duas casas.
    DateTime:
      type: string
      format: date-time
    NullableDateTime:
      type: string
      format: date-time
      nullable: true
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          description: isAdmin() compara exatamente com admin; o padrão persistido do cadastro é client. Não há
            enum no banco.
      required:
      - id
      - name
      - email
      - role
    RegisteredUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          nullable: true
          description: 'O cadastro retorna o model recém-criado sem refresh: o default client do banco ainda não
            foi carregado e role pode ser null. /auth/me já retorna client.'
      required:
      - id
      - name
      - email
      - role
    RawUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          description: isAdmin() compara exatamente com admin; o padrão persistido do cadastro é client. Não há
            enum no banco.
        email_verified_at:
          $ref: '#/components/schemas/NullableDateTime'
        created_at:
          $ref: '#/components/schemas/NullableDateTime'
        updated_at:
          $ref: '#/components/schemas/NullableDateTime'
      description: Model User serializado diretamente por /api/user, sem envelope data. password e remember_token
        ficam ocultos.
      required:
      - id
      - name
      - email
      - role
      - email_verified_at
      - created_at
      - updated_at
    CartMerge:
      type: object
      properties:
        merged:
          type: boolean
        adjustments:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              requested_quantity:
                type: integer
              final_quantity:
                type: integer
              reason:
                type: string
                enum:
                - produto_indisponivel
                - estoque_insuficiente
            required:
            - product_id
            - requested_quantity
            - final_quantity
            - reason
      description: 'Fusão do carrinho visitante na conta. Soma quantidades, limita ao estoque, descarta produtos
        inativos/excluídos e remove o carrinho visitante. Sem carrinho visitante válido: merged=false e adjustments=[].'
      required:
      - merged
      - adjustments
    AuthResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
        cart_merge:
          $ref: '#/components/schemas/CartMerge'
      required:
      - data
      - cart_merge
    RegisterResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RegisteredUser'
        cart_merge:
          $ref: '#/components/schemas/CartMerge'
      required:
      - data
      - cart_merge
    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
      required:
      - data
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
      required:
      - email
      - password
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          description: Único em users.email.
        password:
          type: string
          format: password
          minLength: 8
        password_confirmation:
          type: string
          format: password
          description: Deve coincidir com password.
      required:
      - name
      - email
      - password
      - password_confirmation
    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
      required:
      - id
      - name
      - slug
    CategoryResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Category'
      required:
      - data
    CategoriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - data
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 255
          description: Único em categories.slug; na atualização ignora a própria categoria. Não há validação de
            formato de slug.
      required:
      - name
      - slug
    CategoryUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 255
          description: Único em categories.slug; na atualização ignora a própria categoria. Não há validação de
            formato de slug.
      description: PUT e PATCH aceitam atualização parcial. Campos enviados são obrigatórios e não podem ser vazios;
        corpo vazio é aceito.
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
        available:
          type: boolean
          description: is_active && stock > 0.
        image_path:
          type: string
          nullable: true
        is_active:
          type: boolean
        image_url:
          type: string
          nullable: true
          description: URL do disco public para image_path; pode ser relativa. null quando não há imagem.
        category:
          $ref: '#/components/schemas/Category'
      description: ProductResource com category carregada em todas as operações atuais. Não expõe category_id nem
        timestamps.
      required:
      - id
      - name
      - description
      - price
      - stock
      - available
      - image_path
      - is_active
      - image_url
      - category
    CreatedProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          oneOf:
          - type: string
          - type: number
          description: 'Sem cast no model: na criação conserva o tipo enviado em price. Nas leituras posteriores
            o decimal do MySQL é string com duas casas.'
        stock:
          oneOf:
          - type: integer
          - type: string
          description: 'Na criação conserva o tipo enviado: inteiro JSON ou string de formulário. Nas leituras posteriores
            é inteiro.'
        available:
          type: boolean
          description: is_active && stock > 0.
        image_path:
          type: string
          nullable: true
        is_active:
          type: boolean
        image_url:
          type: string
          nullable: true
          description: URL do disco public para image_path; pode ser relativa. null quando não há imagem.
        category:
          $ref: '#/components/schemas/Category'
      description: Resource do model recém-criado, antes de refresh; price e stock conservam o tipo recebido.
      required:
      - id
      - name
      - description
      - price
      - stock
      - available
      - image_path
      - is_active
      - image_url
      - category
    ProductResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Product'
      required:
      - data
    CreatedProductResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreatedProduct'
      required:
      - data
    ProductInput:
      type: object
      properties:
        category_id:
          type: integer
          description: Deve existir em categories.id.
